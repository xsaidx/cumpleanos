<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi primer añito 🐝</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="cumpleaños.css">
</head>

<body>

    <!-- Dibujos reutilizables: abejita y corazón -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="abeja" viewBox="0 0 100 100">
            <clipPath id="cuerpo">
                <ellipse cx="50" cy="60" rx="30" ry="26" />
            </clipPath>
            <ellipse cx="34" cy="32" rx="14" ry="22" transform="rotate(-25 34 32)" fill="#D9F0FB" stroke="#9CCFE8"
                stroke-width="2" />
            <ellipse cx="66" cy="32" rx="14" ry="22" transform="rotate(25 66 32)" fill="#D9F0FB" stroke="#9CCFE8"
                stroke-width="2" />
            <path d="M42 38Q38 22 30 18M58 38Q62 22 70 18" fill="none" stroke="#4A3320" stroke-width="3"
                stroke-linecap="round" />
            <circle cx="30" cy="18" r="3.5" fill="#4A3320" />
            <circle cx="70" cy="18" r="3.5" fill="#4A3320" />
            <ellipse cx="50" cy="60" rx="30" ry="26" fill="#F6B93B" />
            <g clip-path="url(#cuerpo)" fill="#4A3320">
                <rect x="15" y="74" width="70" height="7" />
                <rect x="15" y="86" width="70" height="7" />
            </g>
            <circle cx="40" cy="56" r="4.5" fill="#4A3320" />
            <circle cx="60" cy="56" r="4.5" fill="#4A3320" />
            <circle cx="41.5" cy="54.5" r="1.5" fill="#fff" />
            <circle cx="61.5" cy="54.5" r="1.5" fill="#fff" />
            <circle cx="31" cy="65" r="5" fill="#F4A6B8" opacity=".75" />
            <circle cx="69" cy="65" r="5" fill="#F4A6B8" opacity=".75" />
            <path d="M44 64Q50 71 56 64" fill="none" stroke="#4A3320" stroke-width="3" stroke-linecap="round" />
        </symbol>
        <symbol id="corazon" viewBox="0 0 24 24">
            <path fill="currentColor"
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </symbol>
    </svg>

    <!-- PANTALLA 1: el sobre -->
    <main id="pantalla-sobre" class="pantalla">
        <p class="pista display">Hay una invitación para ti</p>

        <div class="sobre" id="sobre">
            <div class="tapa"></div>
            <div class="carta"><svg class="abeja">
                    <use href="#abeja" />
                </svg></div>
            <div class="frente"></div>
            <svg class="sello">
                <use href="#abeja" />
            </svg>
        </div>

        <button id="btnAbrir" class="btn btn-abrir" type="button">Abrir invitación</button>
    </main>

    <!-- PANTALLA 2: la invitación -->
    <section id="invitacion" class="pantalla" hidden>
        <div id="abejas" aria-hidden="true"></div>

        <div class="container">
            <div class="tarjeta mx-auto text-center">
                <svg class="abeja heroe">
                    <use href="#abeja" />
                </svg>

                <p class="mb-1">¡Mi primer añito!</p>
                <h1 class="nombre" data-nombre>${NOMBRE}</h1>

                <div class="corazones" aria-hidden="true">
                    <svg>
                        <use href="#corazon" />
                    </svg><svg>
                        <use href="#corazon" />
                    </svg><svg>
                        <use href="#corazon" />
                    </svg>
                </div>

                <p class="invita">Te invito a celebrar que ya soy una abejita de 1 año.</p>

                <h2 class="h5 display mt-4 mb-2" id="titulo-cuenta">Faltan</h2>
                <div class="row g-2 justify-content-center" id="contador" aria-live="off">
                    <div class="col-3">
                        <div class="unidad"><b id="dias">00</b><span>días</span></div>
                    </div>
                    <div class="col-3">
                        <div class="unidad"><b id="horas">00</b><span>horas</span></div>
                    </div>
                    <div class="col-3">
                        <div class="unidad"><b id="minutos">00</b><span>min</span></div>
                    </div>
                    <div class="col-3">
                        <div class="unidad"><b id="segundos">00</b><span>seg</span></div>
                    </div>
                </div>

                <ul class="datos list-unstyled mt-4 mb-0">
                    <li><strong>Fecha:</strong> 31 de diciembre</li>
                    <li><strong>Hora:</strong> </li>
                    <li><strong>Lugar:</strong> </li>
                </ul>

                <p class="mt-4 mb-0 display">¡Te esperamos con mucha miel!</p>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cumpleaños.js"></script>
</body>

</html>
